backend:
  name: github
  repo: CorneHogerheijde/Portfolio-Corne
  branch: main

# Local development only: uses the local Decap proxy server when available.
local_backend: true

media_folder: "src/static/img"
public_folder: "/img"

collections:
  - name: "pages_en"
    label: "Pages (EN)"
    files:
      - label: "Home"
        name: "home"
        file: "src/content/_index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }

      - label: "About"
        name: "about"
        file: "src/content/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Experience"
        name: "experience"
        file: "src/content/experience.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Skills"
        name: "skills"
        file: "src/content/skills.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Contact"
        name: "contact"
        file: "src/content/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages_nl"
    label: "Pagina's (NL)"
    files:
      - label: "Home"
        name: "home_nl"
        file: "src/content/_index.nl.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }

      - label: "Over mij"
        name: "about_nl"
        file: "src/content/about.nl.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Ervaring"
        name: "experience_nl"
        file: "src/content/experience.nl.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Vaardigheden"
        name: "skills_nl"
        file: "src/content/skills.nl.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Contact"
        name: "contact_nl"
        file: "src/content/contact.nl.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "blog_en"
    label: "Blog Posts (EN)"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "blog_nl"
    label: "Blog Posts (NL)"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}.nl"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
